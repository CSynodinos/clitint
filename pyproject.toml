[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clitint"
dynamic = ["version"]
description = "Coloured terminal text with no dependencies, plain wherever it isn't read on a terminal."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christos Synodinos" }]
dependencies = []
keywords = ["terminal", "colour", "color", "ansi", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://csynodinos.github.io/clitint/"
Documentation = "https://csynodinos.github.io/clitint/"
Repository = "https://github.com/CSynodinos/clitint"
Issues = "https://github.com/CSynodinos/clitint/issues"
Changelog = "https://csynodinos.github.io/clitint/changelog/"

[project.optional-dependencies]
dev = ["pytest", "mypy", "build", "twine"]
# The site (mkdocs.yml): pip install -e ".[docs]", then mkdocs serve.
docs = ["mkdocs-material>=9.5,<10"]

[tool.setuptools.dynamic]
version = { attr = "clitint.__version__" }

[tool.setuptools.packages.find]
include = ["clitint*"]

[tool.setuptools.package-data]
clitint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
